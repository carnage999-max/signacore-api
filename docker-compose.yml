services:
  api:
    build:
      context: .
    container_name: ${SIGNACORE_API_CONTAINER_NAME:-signacore-api}
    env_file:
      - .env
    environment:
      # One container migrates and the rest wait for it. When all three ran migrations they raced
      # for the same DDL and the losers died on what the winner had just applied.
      SIGNACORE_RUN_MIGRATIONS: "1"
    command:
      - gunicorn
      - signacore_api.wsgi:application
      - --bind
      - 0.0.0.0:8010
      - --workers
      - ${GUNICORN_WORKERS:-3}
      - --timeout
      - ${GUNICORN_TIMEOUT:-120}
    volumes:
      - ${SIGNACORE_HOST_STORAGE_ROOT:-/mnt/data/media/signa-core}:/mnt/data/media/signa-core
      - ${SIGNACORE_HOST_STATIC_ROOT:-/srv/apps/signacore-api/staticfiles}:/srv/apps/signacore-api/staticfiles
    ports:
      - "127.0.0.1:${SIGNACORE_API_PORT:-8010}:8010"
    tmpfs:
      - /run/signacore:rw,noexec,nosuid,nodev,size=512m,mode=0700
    restart: unless-stopped

  worker:
    build:
      context: .
    container_name: ${SIGNACORE_WORKER_CONTAINER_NAME:-signacore-worker}
    env_file:
      - .env
    environment:
      SIGNACORE_RUN_MIGRATIONS: "0"
    command:
      - celery
      - -A
      - signacore_api
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}
    volumes:
      - ${SIGNACORE_HOST_STORAGE_ROOT:-/mnt/data/media/signa-core}:/mnt/data/media/signa-core
      - ${SIGNACORE_HOST_STATIC_ROOT:-/srv/apps/signacore-api/staticfiles}:/srv/apps/signacore-api/staticfiles
    restart: unless-stopped
    depends_on:
      - api

  beat:
    build:
      context: .
    container_name: ${SIGNACORE_BEAT_CONTAINER_NAME:-signacore-beat}
    env_file:
      - .env
    environment:
      SIGNACORE_RUN_MIGRATIONS: "0"
    command:
      - celery
      - -A
      - signacore_api
      - beat
      - --loglevel=info
    volumes:
      - ${SIGNACORE_HOST_STORAGE_ROOT:-/mnt/data/media/signa-core}:/mnt/data/media/signa-core
      - ${SIGNACORE_HOST_STATIC_ROOT:-/srv/apps/signacore-api/staticfiles}:/srv/apps/signacore-api/staticfiles
    restart: unless-stopped
    depends_on:
      - api

networks:
  default:
    name: shared-net
    external: true
