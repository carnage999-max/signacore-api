name: SignaCore API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signacore-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: signacore_api.settings
  SECRET_KEY: ci-only-signacore-secret-key-do-not-use-in-production-1234567890
  FERNET_KEY: WtF08bpUcDm4uvofwRRmm-JO-17mi6T6qwrmeJEC9Gc=
  DEBUG: "True"
  SIGNACORE_TEMP_ROOT: /tmp/signacore

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run isort, Black, and Ruff
        run: python -m pre_commit run --all-files --show-diff-on-failure

  tests:
    name: Django tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Check migrations and run test suite
        run: |
          mkdir -p "$SIGNACORE_TEMP_ROOT"
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py test

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify staging deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_STAGING_DEPLOY_TOKEN }}
        run: |
          test -n "$COOLIFY_WEBHOOK" || { echo "COOLIFY_STAGING_DEPLOY_WEBHOOK is not configured"; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo "COOLIFY_STAGING_DEPLOY_TOKEN is not configured"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
